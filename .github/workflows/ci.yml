# Lint, types and the unit tests on every push and pull request.
# Not yet run anywhere: written before the repository was hosted. The oracle tests
# (pytest -m oracle) are not run here, since their model files are not in the repository;
# they skip themselves when the files are absent.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff>=0.3.0"
      - run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Install (compiles the native extension)
        run: python -m pip install -e ".[dev]"
      - name: The extension loads
        run: python -c "import rvt_prt._native, rvt_prt; print(rvt_prt.__version__)"
      - run: mypy
      - run: pytest tests/unit
