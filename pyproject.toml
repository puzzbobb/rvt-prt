[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "rvt-prt"
version = "0.1.0"
description = "Fast, standalone vector PDF sheet renderer for Autodesk Revit (.rvt) models"
readme = "package_readme.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "puzzbobb" }]
keywords = ["revit", "rvt", "bim", "aec", "pdf", "dwfx", "dxf", "drawings", "sheets", "cad"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pymupdf>=1.24.0",
    "numpy>=1.26.0",
    "shapely>=2.0.0",
    "olefile>=0.47",
    "fonttools>=4.40",  # PyMuPDF's subset_fonts: only the glyphs used are embedded
]

[project.optional-dependencies]
dxf = ["ezdxf>=1.3"]  # DXF export and reading Revit's DXF exports (rvt-prt compare)
dev = [
    "ezdxf>=1.3",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "maturin>=1.7,<2",  # maturin develop --release: rebuild the extension without pip
]

[project.scripts]
rvt-prt = "rvt_prt.cli:main"

[tool.maturin]
# the native extension (native/, on the rvt crate from crates.io) builds as rvt_prt._native
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "rvt_prt._native"
profile = "release"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# pyflakes, the pycodestyle errors and bugbear: what finds mistakes. Style is not gated.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "E702",  # a; b on one line, in the bench scripts
    "E731",  # small lambdas given a name
    "E741",  # l for a link, as the geometry code names it
    "B007",  # tuples unpacked in a for whose every name is not used
    "B019",  # RevitFile.inflated is cached for the life of the file, which is the point
    "B023",  # helpers defined and called within one turn of a loop
    "B905",  # zip() of sequences of one length by construction
]

[tool.mypy]
python_version = "3.10"
files = ["src/rvt_prt"]
ignore_missing_imports = true  # olefile, shapely, ezdxf and the compiled extension ship no stubs
disable_error_code = ["import-untyped", "var-annotated"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["oracle: the test oracles scored against Revit's exports (pytest -m oracle)"]
