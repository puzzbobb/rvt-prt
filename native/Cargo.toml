[package]
name = "rvt-prt-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
description = "rvt-prt's native extension: rvt-rs's IFC export and element meshes, in-process"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
rvt = "=0.25.0"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
serde_json = "1"
earcut = "0.4"
i_overlay = "4"

[build-dependencies]
pyo3-build-config = "0.29"

[profile.release]
codegen-units = 4
